<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf4f5"><title>Administrator sign in | VendorVerse</title><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#193543;background:#eef4f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 5%,#d9efeb,transparent 42%),linear-gradient(145deg,#eef3f7,#f3faf9)}.card{width:min(470px,100%);padding:38px;background:#fff;border:1px solid #d9e5e8;border-radius:24px;box-shadow:0 22px 60px #173c4b12}.brand{display:flex;align-items:center;gap:12px;margin-bottom:35px;font-size:24px;font-weight:800;letter-spacing:-.04em}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#0b7180,#54a99f);color:white}.eyebrow{color:#0b7180;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0;font-size:30px;letter-spacing:-.04em}p{color:#627985;line-height:1.6}.field{display:grid;gap:7px;margin:19px 0}.field label{font-size:13px;font-weight:700}.field input{height:48px;width:100%;padding:0 14px;border:1px solid #d8e4e8;border-radius:12px;font:inherit;color:#193543}.field input:focus{outline:3px solid #0b718033;border-color:#0b7180}.submit{height:50px;width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,#0b7180,#3f9c98);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}.message{min-height:20px;color:#b42318;font-size:13px;margin:0 0 8px}.access{margin-top:21px;padding:14px;border-radius:12px;background:#f3f8f8;color:#526b77;font-size:12px;line-height:1.65}.access summary{cursor:pointer;font-weight:700;color:#0b7180}.access code{font-family:ui-monospace,monospace}@media(max-width:480px){.card{padding:25px 20px}.brand{margin-bottom:27px}}
</style></head><body><main class="card"><div class="brand"><span class="mark">V</span>VendorVerse</div><span class="eyebrow">Restricted workspace</span><h1>Administrator sign in</h1><p>Use your administrator credentials to open platform operations.</p><form id="adminLogin"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p id="message" class="message" role="alert" aria-live="polite"></p><button class="submit" type="submit">Sign in</button></form><details class="access"><summary>Local preview access</summary><div>Email: <code>admin@vendorverse.in</code><br>Password: <code>Admin123!</code><br>This browser-only sign-in is for interface review and does not enforce server authorization.</div></details></main><script>document.querySelector('#adminLogin').addEventListener('submit',function(event){event.preventDefault();const d=new FormData(this),ok=d.get('email')==='admin@vendorverse.in'&&d.get('password')==='Admin123!';if(!ok){document.querySelector('#message').textContent='The email or password is not recognised.';return}sessionStorage.setItem('vendorverse_admin_authorized','1');window.location.replace('admin.html')});</script></body></html>
